name: Build desktop applications
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Linux packages
        if: runner.os == 'Linux'
        run: npm run bundle:linux
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npm run bundle:windows
      - uses: actions/upload-artifact@v4
        with:
          name: snes-graph-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe

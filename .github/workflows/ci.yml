name: Desktop CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      build_packages:
        description: Build and validate desktop packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y cc65
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run build
  packages:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.build_packages }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: fedora
            os: ubuntu-24.04
            container: fedora:44
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Fedora tools
        if: matrix.platform == 'fedora'
        run: dnf install -y git nodejs npm gcc gcc-c++ make curl rust cargo openssl-devel webkit2gtk4.1-devel gtk3-devel librsvg2-devel libappindicator-gtk3-devel patchelf rpm-build xorg-x11-server-Xvfb dejavu-sans-fonts
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Ubuntu tools
        if: matrix.platform == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev patchelf libfuse2t64 libayatana-appindicator3-dev xvfb
      - run: npm ci
      - run: npm run bundle:${{ matrix.platform }}
      - name: Ubuntu package metadata
        if: matrix.platform == 'ubuntu'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find src-tauri/target/release/bundle/deb -name '*.deb')
          test "$(dpkg-deb -f "$package" Version)" = "$(node -p 'require("./package.json").version')"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb -c "$package"
      - name: Fedora package metadata
        if: matrix.platform == 'fedora'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find src-tauri/target/release/bundle/rpm -name '*.rpm')
          test "$(rpm -qp --qf '%{VERSION}' "$package")" = "$(node -p 'require("./package.json").version')"
          test "$(rpm -qp --qf '%{ARCH}' "$package")" = x86_64
          rpm -qpl "$package"
      - name: Windows installation and startup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $package = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($package.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = "$env:LOCALAPPDATA\SNES Graph"
          $installer = Start-Process $package[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $exe = Join-Path $installDir 'snes-graph.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Application exited during startup' }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: snes-graph-${{ matrix.platform }}-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe

  linux-install:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            image: ubuntu:24.04
          - platform: fedora
            image: fedora:44
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    steps:
      - name: Minimal test environment
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = ubuntu ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates libstdc++6 xvfb xauth fonts-dejavu-core
          else
            dnf install -y ca-certificates libstdc++ xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-fonts shadow-utils
          fi
          useradd -m smoke
      - uses: actions/download-artifact@v4
        with:
          name: snes-graph-${{ matrix.platform }}-x86_64
          path: packages
      - name: Install with runtime dependencies and smoke-test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = ubuntu ]; then
            package=$(find packages -name '*.deb')
            DEBIAN_FRONTEND=noninteractive apt-get install -y "$PWD/$package"
          else
            package=$(find packages -name '*.rpm')
            dnf install -y "$package"
          fi
          test -f /usr/share/mime/packages/snes-graph.xml
          test -f "/usr/share/applications/SNES Graph.desktop"
          runuser -u smoke -- xvfb-run -a bash -c 'set -e; snes-graph > /tmp/startup.log 2>&1 & pid=$!; sleep 10; kill -0 "$pid"; kill "$pid"' || { cat /tmp/startup.log; exit 1; }
          if [ "$PLATFORM" = ubuntu ]; then
            image=$(find "$PWD/packages" -name '*.AppImage')
            chmod +x "$image"
            runuser -u smoke -- env APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a bash -c 'set -e; "$1" > /tmp/appimage.log 2>&1 & pid=$!; sleep 10; kill -0 "$pid"; kill "$pid"' _ "$image" || { cat /tmp/appimage.log; exit 1; }
          fi

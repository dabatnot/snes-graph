<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep WebKit/Skia away from the full host font collection and its rules.
       These directories cover common Fedora and Debian/Ubuntu installations. -->
  <dir>/usr/share/fonts/liberation-sans-fonts</dir>
  <dir>/usr/share/fonts/liberation-mono-fonts</dir>
  <dir>/usr/share/fonts/dejavu-sans-fonts</dir>
  <dir>/usr/share/fonts/dejavu-sans-mono-fonts</dir>
  <dir>/usr/share/fonts/gdouros-symbola</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
